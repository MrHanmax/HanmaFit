[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old domain variants point to the one real domain
[[redirects]]
  from = "https://www.hanmafit.com/*"
  to = "https://hanmafit.com/:splat"
  status = 301
  force = true

# Search Console may still request the old sitemap path
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
